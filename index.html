# Slide 1: Features of the Shiny App

### Core Specifications
* **Dataset:** Using the classic `mtcars` dataset.
* **Multivariable Regression Model:** Extended to variables `am`, `wt`, and `qsec`.
* **Model Equation:** `fit_final &lt;- lm(mpg ~ am + wt + qsec, data = mtcars)`

### Interactive Features Built-In
* **Drop-downs:** Select `am`, `wt`, and `qsec` correlations with `mpg`.
* **Summary Table:** Real-time display of the final model coefficients.
* **Sliders:** Adjust the `wt` slope to instantly see its effect on `mpg`.

---

# Slide 2: Correlation Analysis

### Dynamic Variable Selection
* Use the application drop-down menu to select target variables for correlation analysis.
* **Example Use Case:** Selecting **"wt"** immediately prints the correlation plot between weight and miles per gallon (`mpg`).

&gt; **Note:** The drop-down selection framework strictly controls the Correlation Plot element without altering the base regression model.

---

# Slide 3: Interactive Slope Modification

### Real-Time Sensitivity Analysis
* The interactive slider explicitly alters the weight (`wt`) slope coefficient value.
* Allows user-driven testing to see exactly how slope tweaks impact predicted MPG compared directly against the actual dataset.

&gt; **Note:** This specific slider manipulation framework works exclusively for the **Interactive Prediction Plot**.

---

# Slide 4: Final Model Summary &amp; Metrics

### Extracting Model Parameters
* The application displays the **Final Model Summary Table** directly on screen.
* Users can instantly pull exact coefficient values from the calculated OLS model.

### Error Tracking
* The **Residual Sum of Squares (RSS)** is continuously calculated in the background.
* RSS values are successively piped into and compared within the Interactive Prediction Plot.

---

# Slide 5: Interactive Prediction Plot

### Impact of Changing 'wt' Slope on MPG
* This layout demonstrates the real-time deviation between static and interactive modeling.

* 🔵 **Blue Line:** Represents the updated application predictions using your manually adjusted slope.
* 🔘 **Grey Dashed Line:** Represents the original, mathematically optimized baseline OLS model predictions.
